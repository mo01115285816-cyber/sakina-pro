  <style>
    * {

      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* شفافية مطلقة — خلفية التطبيق هي اللي تظهر */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrapper {
      position: relative;
      width: var(--sk-size, 240px);
      height: var(--sk-size, 240px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sakeenah-engine-mount {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sakeenah-engine-mount .bs-avatar {
      width: 100% !important;
      height: 100% !important;
    }

    /* دخول ناعم */
    @keyframes glassEntrance {
      from { opacity: 0; transform: translateY(16px) scale(0.88); }
      to { opacity: 1; transform: none; }
    }
    .is-entrance { animation: glassEntrance 0.75s cubic-bezier(0.34, 1.4, 0.64, 1) both; }

    /* احترام تفضيل تقليل الحركة — المحرك نفسه بيتعامل معاه برضه */
    @media (prefers-reduced-motion: reduce) {
      .is-entrance { animation: none; }
    }
  </style>

  SakeenahAvatar.prototype.stop = function () { this.controller.stop(); };
  SakeenahAvatar.prototype._playEntrance = function () {
    var root = this.root;
    root.classList.remove('is-entrance');
    void root.offsetWidth;
    root.classList.add('is-entrance');
  };
  SakeenahAvatar.prototype.destroy = function () {
    if (this.isDestroyed) return;
    this.isDestroyed = true;
    this.controller.destroy();
  };

  // إيقاف ذكي لما الصفحة تتخفي (توفير بطارية)
  SakeenahAvatar.prototype._installBridges = function () {
    var self = this;
    this._onVisibility = function () {
      if (self.isDestroyed) return;
      if (document.hidden) {
        self._suspended = self.getState().animation;
        self.root.classList.add('is-paused');
        self.controller.pause();
      } else {
        self.root.classList.remove('is-paused');
        if (self._suspended) self.controller.play(self._suspended);
      }
    };
    document.addEventListener('visibilitychange', this._onVisibility);
  };

  window.SakeenahAvatar = SakeenahAvatar;
})();

  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var rootEl = document.getElementById('sakeenahRoot');
      var avatar = new SakeenahAvatar(rootEl, { initialAnim: 'idle', entrance: true });

      /* واجهة التحكم العالمية للمبرمج */
      window.sakeenah = avatar;

      /* الضغط ينتقل للحركة التالية (مفيد للاختبار) */
      rootEl.addEventListener('click', function () { avatar.next(); });

      /* لوحة المفاتيح */
      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'ArrowDown') avatar.next();
        else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') avatar.prev();
      });

      /* تحكم عن بُعد: postMessage({anim:'happy'}) أو postMessage('happy') */
      window.addEventListener('message', function (e) {
        var data = e.data;
        if (!data) return;
        var key = typeof data === 'string' ? data : data.anim;
        if (key) avatar.play(key);
      });
    });
  </script>
</body>
